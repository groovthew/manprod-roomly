<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="house" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (iOS/Android friendly) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Sparkle accents -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M 410 105 L 418 130 L 443 138 L 418 146 L 410 171 L 402 146 L 377 138 L 402 130 Z"/>
  </g>
  <g fill="#ffffff" opacity="0.6">
    <path d="M 95 385 L 100 400 L 115 405 L 100 410 L 95 425 L 90 410 L 75 405 L 90 400 Z"/>
  </g>
  <circle cx="440" cy="380" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="80" cy="120" r="4" fill="#ffffff" opacity="0.5"/>

  <!-- House -->
  <g transform="translate(256, 290)">
    <!-- Drop shadow -->
    <ellipse cx="0" cy="125" rx="170" ry="14" fill="rgba(8, 50, 70, 0.25)"/>

    <!-- Roof -->
    <path d="M -160 -25 L 0 -160 L 160 -25 Z" fill="url(#house)" stroke="#0e7490" stroke-width="8" stroke-linejoin="round"/>

    <!-- Chimney -->
    <rect x="65" y="-110" width="32" height="55" fill="url(#house)" stroke="#0e7490" stroke-width="6" stroke-linejoin="round"/>

    <!-- Body -->
    <rect x="-125" y="-25" width="250" height="155" fill="url(#house)" stroke="#0e7490" stroke-width="8" stroke-linejoin="round"/>

    <!-- Door -->
    <rect x="-32" y="50" width="64" height="80" rx="6" fill="#0891b2"/>
    <circle cx="22" cy="92" r="5" fill="#22d3ee"/>

    <!-- Window left -->
    <rect x="-95" y="5" width="46" height="46" rx="4" fill="#22d3ee" stroke="#0e7490" stroke-width="3"/>
    <line x1="-95" y1="28" x2="-49" y2="28" stroke="#ffffff" stroke-width="3"/>
    <line x1="-72" y1="5" x2="-72" y2="51" stroke="#ffffff" stroke-width="3"/>

    <!-- Window right -->
    <rect x="49" y="5" width="46" height="46" rx="4" fill="#22d3ee" stroke="#0e7490" stroke-width="3"/>
    <line x1="49" y1="28" x2="95" y2="28" stroke="#ffffff" stroke-width="3"/>
    <line x1="72" y1="5" x2="72" y2="51" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
